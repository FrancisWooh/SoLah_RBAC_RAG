name: Build and Push Docker Images

on:
  push:
    branches: [ProdEnv]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fancylan
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            fancylan/so-lah-rbac-rag:backend
            fancylan/so-lah-rbac-rag:backend-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            fancylan/so-lah-rbac-rag:frontend
            fancylan/so-lah-rbac-rag:frontend-${{ github.sha }}

      - name: Image digest
        run: echo "Backend and frontend images pushed to Docker Hub"
